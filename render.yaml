# Render Blueprint for PI Coach. In Render: New → Blueprint → pick this repo.
# Secrets are NOT in this file (sync: false) — set them in the dashboard so they
# never land in git. Swap `plan: starter` ($7/mo, always warm) when you outgrow
# the free tier's cold starts.
services:
  - type: web
    name: pi-coach
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set in dashboard (secret)
      - key: TRANSCRIPTION_API_KEY
        sync: false # set in dashboard (secret)
      - key: ANTHROPIC_MODEL
        # Keep in step with app/config.py's documented default. This pin had
        # drifted a generation behind it (claude-sonnet-4-6), which quietly
        # overrode the code: Sonnet 5 is both cheaper per token and stronger, and
        # the comments in config.py already described it as what we run.
        value: claude-sonnet-5
      - key: SITE_URL
        # Public origin baked into canonicals, Open Graph tags and sitemap.xml.
        # Must be the domain you want indexed — if this ever says
        # pi-coach-xxxx.onrender.com, Google indexes that hostname instead.
        value: https://trypicoach.com
      - key: DAILY_REQUEST_CAP
        # App-level wallet guard; tune to your provider spend caps. Read it as
        # SESSIONS, not requests: one spoken role-play costs ~3 counted calls
        # (scenario, transcribe, grade), so 500 is roughly 165 role-plays a day
        # across all users combined. Grading and transcription now get a grace
        # band above this so a rep already recorded still finishes — the cap
        # stops new sessions rather than destroying ones in flight.
        value: "500"
      - key: RATE_LIMIT_PER_MIN
        # Per-IP burst limit. Sized for a shared school NAT: a class of ~30 all
        # starting a rep in the same minute is the pattern this product is for,
        # and at the old 20 it read as one abusive client and 429'd the room
        # mid-rep. See the header of app/ratelimit.py.
        value: "120"
      - key: POSTHOG_KEY
        sync: false # public PostHog project key; optional, served via /api/config
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
      - key: RESEND_API_KEY
        sync: false # secret; enables emailing each feedback submission
      - key: FEEDBACK_EMAIL_TO
        value: tannavr898@gmail.com
      - key: SUPABASE_URL
        sync: false # public Supabase project URL; enables login + progress
      - key: SUPABASE_ANON_KEY
        sync: false # public anon key (served via /api/config, guarded by RLS)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # SECRET service_role key; backend-only DB access
      - key: ADMIN_PASSPHRASE
        sync: false # secret passphrase for the owner-only /admin QA page
